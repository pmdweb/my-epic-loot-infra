services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: epic
      POSTGRES_USER: epic
      POSTGRES_PASSWORD: epic
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epic"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: ../my-epic-loot-backend
      dockerfile: Dockerfile
    env_file:
      - ./.envs/dev.env
    environment:
      DJANGO_SECRET_KEY: dev
      DJANGO_DEBUG: "1"
      POSTGRES_DB: epic
      POSTGRES_USER: epic
      POSTGRES_PASSWORD: epic
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_COLLECTSTATIC: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  storage:
    build:
      context: ../my-epic-loot-storage
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      - minio

  logging:
    build:
      context: ../my-epic-loot-logging
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ../my-epic-loot-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ../my-epic-loot-frontend/src:/app/src
      - ../my-epic-loot-frontend/public:/app/public
      - ../my-epic-loot-frontend/next.config.js:/app/next.config.js
      # Prevent node_modules from being overwritten
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

volumes:
  db-data:
  mongo-data:
  minio-data:
